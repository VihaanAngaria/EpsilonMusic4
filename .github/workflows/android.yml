name: Build Epsilon Music APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Show Java and Gradle versions
        run: |
          java -version
          ./gradlew --version

      - name: Show dependency tree
        run: ./gradlew --no-daemon :app:dependencies --configuration debugRuntimeClasspath

      - name: Build debug APK
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Show APK signing fingerprints
        run: |
          echo "=== Epsilon Music Android OAuth identity ==="
          echo "Package: com.epsilonmusic.app"
          echo "APK: app/build/outputs/apk/debug/app-debug.apk"
          echo
          echo "SHA-1 / SHA-256 of the exact APK certificate:"
          apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          echo
          echo "Register the SHA-1 fingerprint above in Firebase Console -> Project Settings -> Your apps -> Android app."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: epsilon-music-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
